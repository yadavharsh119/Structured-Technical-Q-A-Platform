<!doctype html>
<html lang="en">
  <head>
    <title>Platform Name - Technical Knowledge Sharing</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0px;
        font-family: Arial, sans-serif;
        padding: 32px;
      }
      main {
        flex: 1;
      }
      h1 {
        margin: 0px;
        font-size: 48px;
        font-weight: 700;
      }
      p {
        margin: 0px;
        font-size: 18px;
        line-height: 1.6;
      }

      header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        min-height: 64px;
      }
      form {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      header > nav:last-child {
        justify-self: end;
        display: flex;
        gap: 16px;
      }
      section {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
        gap: 16px;
      }
      a {
        text-decoration: none;
      }
      .button {
        background-color: #111;
        color: aliceblue;
        border-radius: 4px;
        padding: 6px 12px;
        border: 1px solid #030404;
      }
      .search-input {
        height: 32px;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 14px;
        width: 180px;
      }
      .register {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="Main navigation">
        <a href="/home" aria-label="Platform home"> Platform Name </a>
      </nav>
      <form role="search" action="/search" method="get">
        <label for="query-search">Search</label>
        <input
          type="search"
          id="query-search"
          name="user-query"
          placeholder="Search discussions"
          class="search-input"
        />

        <button type="submit" class="button">Search</button>
      </form>
      <nav aria-label="Account navigation">
        <a href="/login" class="button">Login</a>
        <a href="/register" class="button register">Register</a>
      </nav>
    </header>
    <main>
      <section>
        <h1>Platform Name</h1>

        <p>
          A template-driven platform for high-quality technical knowledge
          sharing
        </p>

        <a href="/topics" class="button">Browse Topics</a>
      </section>
    </main>
    <footer>© 2026 Platform Name. All rights reserved.</footer>
  </body>
</html>
